# health-v2 的 nginx 配置模板（docs/11"nginx"）。
# Windows：放到 nginx 目录的 conf\ 下，在 conf\nginx.conf 的 http { } 里加一行 include hv2.conf;
# 要按服务器改的只有三处，都标了"按实际改"。路径在 Windows 上也用正斜杠。
#
# 浏览器只和 nginx（80 端口）打交道：
#   /                   前端静态文件（frontend/dist 的内容）
#   /api/               转给后端（只监听本机 127.0.0.1:8081）
#   /geoserver/hv2/wms  只转 GeoServer 的这一个 WMS 地址（底图图片，不用登录，docs/06）；
#                       GeoServer 的管理页面、REST 接口一律 404
#   /actuator/          不转发，404。运行指标只在服务器本机看（curl http://127.0.0.1:8081/actuator/...）

server {
    listen 80;                                   # 按实际改：端口
    server_name _;
    server_tokens off;
    charset utf-8;

    root D:/hv2/frontend;                        # 按实际改：frontend/dist 拷到哪里
    index index.html;

    # 请求体只有登录、录入年龄、摆放基站这些小 JSON
    client_max_body_size 1m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 安全响应头。注意：location 里只要写了 add_header，就不再继承这里的，所以下面需要的地方又写了一遍
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;

    location = /index.html {
        # 首页不缓存，换版本后马上生效
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy same-origin always;
    }

    location /assets/ {
        # 构建产物文件名里带内容摘要，可以长期缓存
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8081;        # 按实际改：后端端口（SERVER_PORT）
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 月报第一次打开、导出 Excel 可能要几秒
        proxy_read_timeout 120s;
    }

    location = /geoserver/hv2/wms {
        limit_except GET {
            deny all;
        }
        proxy_pass http://127.0.0.1:8082;        # GeoServer 只监听本机 8082（docs/11"GeoServer"）
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    location /geoserver/ {
        return 404;
    }

    location /actuator/ {
        return 404;
    }

    # 前端用 hash 路由（/#/...），不需要把未知路径回退到 index.html；找不到的文件就是 404
    location / {
        try_files $uri $uri/ =404;
    }
}
