# 配置项和默认值见 docs/01 第五节。敏感信息只从环境变量读取（本机见 health-v2/.env.local）。
server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: hv2-backend
  config:
    # 本机开发时（如在 IDEA 里直接运行）没有设环境变量，就从 health-v2/.env.local 读连接信息；
    # 文件不存在就跳过。环境变量优先级更高，上线时照常用环境变量。
    # 工作目录是 backend/ 时找 ../.env.local，是 health-v2/ 时找 ./.env.local。
    import:
      - optional:file:../.env.local[.properties]
      - optional:file:./.env.local[.properties]
  datasource:
    url: jdbc:oracle:thin:@//${ORACLE_HOST:127.0.0.1}:${ORACLE_PORT:1521}/${ORACLE_SERVICE:FREEPDB1}
    username: ${ORACLE_USER}
    password: ${ORACLE_PASSWORD}
    hikari:
      pool-name: hv2-oracle
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
      connection-init-sql: ALTER SESSION SET TIME_ZONE = 'Asia/Shanghai'
  task:
    scheduling:
      # 定时任务：定位扫描、缓冲写库（5 秒）、绑定和阈值刷新、日汇总；日汇总慢时不能挡住写库
      pool:
        size: 4
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      # 本项目自己的 Redis 容器 hv2-redis（只对本机开放），不和老项目共用（AGENTS.md"环境"）
      port: ${REDIS_PORT:6380}
      timeout: 3s

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    # 按列名（驼峰）对应 record 的构造参数，不依赖列顺序
    arg-name-based-constructor-auto-mapping: true
    jdbc-type-for-null: 'NULL'

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: never

sa-token:
  token-name: satoken
  # 令牌有效期 7 天；大屏常开，不设无操作超时
  timeout: 604800
  active-timeout: -1
  is-concurrent: true
  is-share: false
  # 令牌只从请求头 satoken 读取，不读写 Cookie
  is-read-cookie: false
  is-read-body: false
  is-write-header: false
  token-style: random-64
  is-print: false
  is-log: false

hv2:
  login:
    # 登录页是否显示默认账号提示；上线前改为 false（docs/08 阶段 7）
    show-default-account: ${LOGIN_SHOW_DEFAULT_ACCOUNT:true}
    default-account-hint: 默认账号 admin，密码 admin
  auth:
    # 同一用户名连续输错 5 次锁定 10 分钟（docs/05 第八节）
    max-failures: 5
    lock-duration: 10m
    fail-key-prefix: "hv2:auth:fail:"
  positioning:
    # 目录留空时用 health-v2/runtime/ 下的 inbox、backup、error（docs/02 第二节）
    inbox-dir: ${POSITIONING_INBOX_DIR:}
    backup-dir: ${POSITIONING_BACKUP_DIR:}
    error-dir: ${POSITIONING_ERROR_DIR:}
    # 本矿煤矿编码，只接收这个矿的文件
    mine-code: ${POSITIONING_MINE_CODE:620823009203}
    scan-enabled: ${POSITIONING_SCAN_ENABLED:true}
    scan-seconds: ${POSITIONING_SCAN_SECONDS:30}
    # 最新一份 RYSS 距现在超过它，算"定位数据已过期"
    stale-minutes: ${POSITIONING_STALE_MINUTES:15}
    # 文件头时间允许比服务器现在晚多少分钟，再晚就拒收
    future-tolerance-minutes: ${POSITIONING_FUTURE_TOLERANCE_MINUTES:5}
    incomplete-timeout: 10m
    max-file-bytes: 20971520
    max-error-ratio: 0.2

  watch:
    # 手表 TCP 接入（docs/03）
    tcp-enabled: ${WATCH_TCP_ENABLED:true}
    tcp-port: ${WATCH_TCP_PORT:9001}
    max-connections: ${WATCH_MAX_CONNECTIONS:2000}
    # 最后上行时间在这个窗口内算"在线"
    online-window-minutes: ${WATCH_ONLINE_WINDOW_MINUTES:20}
    vital-stale-minutes: ${WATCH_VITAL_STALE_MINUTES:12}
    # 每隔多少秒给每块表下发一项测量（心率→血压→血氧→体温轮换）
    monitoring-refresh-seconds: ${WATCH_MONITORING_REFRESH_SECONDS:60}
    login-timeout: 30s
    idle-timeout: 10m
    max-frame-bytes: 8192
    binding-refresh-seconds: 60
    worker-threads: 4
    worker-queue: 10000
    buffer:
      flush-enabled: ${WATCH_BUFFER_FLUSH_ENABLED:true}
      # 本项目的 Redis key 一律以 hv2: 开头
      key-prefix: ${WATCH_BUFFER_KEY_PREFIX:hv2:watch:}
      flush-millis: 5000
      batch-size: 1000
      memory-capacity: 10000
      single-retries: 3
      shutdown-drain-timeout: 20s
  alert:
    dedup-minutes: ${ALERT_DEDUP_MINUTES:30}
    device-dedup-minutes: ${ALERT_DEVICE_DEDUP_MINUTES:2}
    active-minutes: ${ALERT_ACTIVE_MINUTES:30}
    rule-refresh-seconds: 60
  health:
    # HEALTH_DAILY_SUMMARY：每 5 分钟重算今天，0:10 定稿昨天
    summary-enabled: ${HEALTH_SUMMARY_ENABLED:true}
  map:
    # 底图（docs/06）。WMS 地址默认是站内路径，由前端开发服务器 / nginx 转给 GeoServer
    wms-url: ${MAP_WMS_URL:/geoserver/hv2/wms}
    line-layer: hv2:roadway_line
    label-layer: hv2:roadway_label
    projection: EPSG:4527
    # 按选中的巷道线算出的范围（tools/map-prep/build.py 打印），基站只能摆在这里面
    extent:
      min-x: 39480087.9
      min-y: 3851797.4
      max-x: 39489391.2
      max-y: 3854743.4

logging:
  level:
    com.xzkj.hv2: info
