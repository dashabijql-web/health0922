[platformio]
default_envs = esp32_wifi_watch

[env:esp32_wifi_watch]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
lib_deps =
  sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library
  adafruit/Adafruit MPU6050
  adafruit/Adafruit SSD1306
  adafruit/Adafruit GFX Library
build_flags =
  -DCORE_DEBUG_LEVEL=3
  -DWATCH_WIFI_SSID=\"CHANGE_ME\"
  -DWATCH_WIFI_PASSWORD=\"CHANGE_ME\"
  -DWATCH_SERVER_HOST=\"192.168.1.100\"
  -DWATCH_SERVER_PORT=9000
  -DWATCH_IMEI=\"123456789012345\"
  -DWATCH_I2C_SDA=21
  -DWATCH_I2C_SCL=22
